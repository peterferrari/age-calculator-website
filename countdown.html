<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A live countdown to your next birthday.">
    <title>Birthday Countdown</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="countdown-page">
    <div class="container">
        <header>
            <h1>⏳ Birthday Countdown</h1>
            <p id="countdownSubtitle">Bookmark this page to check in any time.</p>
        </header>

        <main>
            <section class="results-section countdown-card">
                <div id="countdownDisplay" hidden>
                    <p id="countdownTitle" class="countdown-title"></p>
                    <div class="countdown-units" aria-live="off">
                        <div><span id="cdDays">0</span><small>days</small></div>
                        <div><span id="cdHours">0</span><small>hours</small></div>
                        <div><span id="cdMinutes">0</span><small>minutes</small></div>
                        <div><span id="cdSeconds">0</span><small>seconds</small></div>
                    </div>
                    <p id="countdownDate" class="countdown-date"></p>
                    <div class="countdown-progress" aria-hidden="true"><div id="countdownBar"></div></div>
                    <p id="countdownProgressText" class="fine-print"></p>
                </div>

                <form id="countdownForm" class="countdown-form" novalidate>
                    <div class="input-group">
                        <label for="countdownInput">Birthday (MM/DD/YYYY or MMDDYYYY)</label>
                        <input type="text" id="countdownInput" placeholder="MM/DD/YYYY" inputmode="numeric" maxlength="10" autocomplete="bday">
                    </div>
                    <div id="countdownError" class="error" role="alert" hidden></div>
                    <button type="submit" class="action-btn">Start countdown</button>
                </form>
                <p class="countdown-links"><a href="index.html">← Back to the Age Calculator</a></p>
            </section>
        </main>
    </div>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script src="countdown.js"></script>
</body>
</html>
